[project]
name = "loobric-cli"
version = "1.8.0"
description = "Python client library and CLI for Loobric Core (CNC tool-data sync)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sliptonic" }]
# The core library and CLI are intentionally stdlib-only, so the package stays
# vendorable and runnable in constrained interpreters.
keywords = ["cnc", "cam", "tool-data", "freecad", "linuxcnc", "machining"]
classifiers = [
      "Development Status :: 3 - Alpha",
      "License :: OSI Approved :: MIT License",
      "Programming Language :: Python :: 3",
      "Topic :: Scientific/Engineering",
      "Intended Audience :: Manufacturing"]
dependencies = []

[project.optional-dependencies]
# DIN 4000 import (CSV + XML) is stdlib-only and ships in the base install. This
# extra is for formats that need heavier parsers — GTC/ISO 13399 P21 (steputils),
# large-XML XSD validation (lxml), etc. (see loobric-core#31 and docs/IMPORTERS_PLAN.md).
importers = ["lxml>=5.0"]
completion = ["argcomplete>=3.0"]
# The MCP server (loobric-mcp): lets AI agents act on a Loobric Server via
# any MCP host. Extra keeps the base install stdlib-only (see MCP_PLAN.md).
# <2: SDK 2.0.0 removed the 1.x low-level Server decorator API (list_tools/
# call_tool) that main.py builds on — a fresh unpinned install crashed at
# startup (2026-07-30). Raise only together with a build_server port.
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=7.4"]

[project.scripts]
loobric = "loobric.cli.main:main"
loobric-mcp = "loobric.mcp.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loobric*"]

[project.urls]
Homepage = "https://github.com/loobric/loobric-cli"
Repository = "https://github.com/loobric/loobric-cli"
Issues = "https://github.com/loobric/loobric-cli/issues"
